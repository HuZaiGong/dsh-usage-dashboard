name: 功能建议
description: 提议一个新功能或改进
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 动机 / 要解决的问题
      description: 你希望在什么场景下解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的行为
      description: 你设想的功能长什么样？怎么交互？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你还考虑过哪些其他做法？
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 截图、数据样例、参考实现等
