# dsh-usage-dashboard bundle layer.
# Applied after @deepseek-ai/dsh-web-app in the profile's bundles list.
# One host row: the usageStats remote service (machine-global, cross-session).
#
# The row is a dual-face package: the loader mounts dist/index.js (node half,
# the TypertRemoteService plugin); the dsh.client manifest in package.json puts
# dist/client.js into the browser roster (window.__DSH_BOOT__ modules table).
- insert:
    - id: usage-stats
      name: 'dsh-usage-dashboard'
